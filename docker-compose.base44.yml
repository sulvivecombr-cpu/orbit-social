# Base44 development compose — runs the Next.js dev server from cloned source.
# Real external secrets are delivered via /run/base44/app.env (last env_file entry wins).
services:
  web:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - .next_cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN}
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        if [ ! -f node_modules/.package-lock.json ]; then npm ci; fi
        exec npx next dev -H 0.0.0.0 -p 3000
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');const r=http.get({host:'localhost',port:3000,path:'/',timeout:5000},res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.on('timeout',()=>{r.destroy();process.exit(1)})"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: on-failure

volumes:
  node_modules:
  .next_cache:
